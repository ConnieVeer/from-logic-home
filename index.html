<!doctype html>
<html lang="nl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#061015">
        <meta name="description" content="FromLogic maakt handige online tools voor geocaching, privacy en administratie.">
        <title>FromLogic</title>
        <style>
            *, *::before, *::after {
                box-sizing: border-box;
            }

            :root {
                color-scheme: dark;
                font-family: system-ui, sans-serif;
                color: #eafaff;
                background: #041319;
            }

            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100svh;
                display: grid;
                grid-template-rows: auto 1fr;
                isolation: isolate;
                position: relative;
            }

            .art, body::after {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
            }

            .art {
                object-fit: cover;
                object-position: 67% bottom;
            }

            body::after {
                content: "";
                background: linear-gradient(90deg, #040c12ed 0%, #040c12a6 31%, #040c1200 70%);
            }

            header, main {
                width: min(88%, 92rem);
                margin-inline: auto; }

            header {
                display: flex;
                align-items: center;
                gap: .65rem;
                padding-block: clamp(1.45rem, 4vw, 3.2rem); font: 700 clamp(1.05rem, 2vw, 1.55rem)/1 ui-monospace, monospace;
                letter-spacing: -.045em;
            }

            header::before {
                content: "";
                width: .62em;
                height: .62em;
                border: 2px solid #89ffd8;
                transform: rotate(45deg);
                box-shadow: 0 0 14px #5effc885;
            }

            main {
                align-self: center;
                padding-block: 1.5rem clamp(4rem, 10vh, 7rem); }

            h1 {
                margin: 0;
                font-size: clamp(3rem, 8.4vw, 9rem);
                font-weight: 800;
                line-height: .93;
                letter-spacing: -.085em;
                text-shadow: 0 3px 24px #000b;
            }

            h1 span {
                display: block;
                color: #89ffd8;
            }

            @media (min-aspect-ratio: 2/1) {
                .art {
                    object-fit: contain;
                    object-position: right bottom;
                    mask-image: linear-gradient(90deg, transparent max(0px, calc(100% - 178vh)), #000 max(15%, calc(100% - 153vh)));
                }
            }

            @media (max-width: 680px), (max-aspect-ratio: 4/5) {
                body::after {
                    background: linear-gradient(180deg, #041319 25%, #04131900 69%);
                }

                .art {
                    inset: auto 0 0;
                    height: min(67%, 118vw);
                    object-position: 72% bottom;
                }

                main {
                    align-self: start;
                    padding-block: clamp(2rem, 9vh, 5rem) 2.5rem; }

                h1 {
                    font-size: clamp(2.5rem, 11.5vw, 6rem);
                }
            }
        </style>
    </head>
